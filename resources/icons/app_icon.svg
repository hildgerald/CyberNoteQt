<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2838"/>
      <stop offset="1" stop-color="#0e4d4a"/>
    </linearGradient>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#161616"/>
    </linearGradient>
  </defs>

  <!-- fond : app de bureau -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="none" stroke="#0a1620" stroke-width="2"/>

  <!-- bloc-notes : prise de notes -->
  <g transform="translate(20,58) rotate(-8)">
    <rect x="0" y="0" width="56" height="62" rx="6" fill="#f5efdc"/>
    <rect x="0" y="0" width="56" height="62" rx="6" fill="none" stroke="#cfc6a3" stroke-width="1.5"/>
    <rect x="8" y="-4" width="14" height="10" rx="2" fill="#e2574c"/>
    <line x1="10" y1="16" x2="46" y2="16" stroke="#9a9174" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="26" x2="46" y2="26" stroke="#9a9174" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="36" x2="34" y2="36" stroke="#9a9174" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- fenetre de terminal : pentest -->
  <g transform="translate(46,26)">
    <rect x="0" y="0" width="66" height="52" rx="7" fill="url(#term)"/>
    <rect x="0" y="0" width="66" height="52" rx="7" fill="none" stroke="#000" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="0" y="0" width="66" height="14" rx="7" fill="#3a3a3a"/>
    <circle cx="10" cy="7" r="3" fill="#ff5f56"/>
    <circle cx="20" cy="7" r="3" fill="#ffbd2e"/>
    <circle cx="30" cy="7" r="3" fill="#27c93f"/>
    <text x="8" y="38" font-family="monospace" font-size="20" font-weight="bold" fill="#3ddc61">&gt;_</text>
  </g>

  <!-- loupe : investigation / pentest -->
  <g transform="translate(80,70)">
    <circle cx="14" cy="14" r="13" fill="none" stroke="#ff8a3d" stroke-width="6"/>
    <line x1="23" y1="23" x2="34" y2="34" stroke="#ff8a3d" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
